[project]
name = "smithereens"
version = "0.1.0"
description = "An experimental lightweight LLM interface."
authors = [
    {name = "acmelaw", email = "acmelaw@protonmail.com"},
]
dependencies = [
    "litellm>=1.40",
    "dspy>=2.6",
    "rich>=13.0",
]
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
smithereens = "smithereens.cli:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[dependency-groups]
dev = [
    "ruff>=0.11",
]
test = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "pytest-cov>=6.1",
]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (formatter handles it)
    "RUF001", # ambiguous unicode — intentional (prompt glyph ❯)
    "TC001", # TYPE_CHECKING blocks add complexity for little gain here
    "SIM105", # contextlib.suppress is less readable for simple cases
]

[tool.ruff.lint.isort]
known-first-party = ["smithereens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
