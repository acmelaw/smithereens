[project]
name = "smithereens"
version = "0.1.0"
description = "An experimental lightweight LLM interface."
authors = [
    {name = "acmelaw", email = "acmelaw@protonmail.com"},
]
dependencies = [
    "litellm>=1.40",
    "dspy>=2.6",
    "rich>=13.0",
]
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
smithereens = "smithereens.cli:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[dependency-groups]
test = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
]
